<!doctype html>
<html lang="he"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Heebo:wght@400;500&display=block" rel="stylesheet">
<style>
@page { size: 50mm 90mm; margin: 0 }
html,body{margin:0;padding:0;background:#fff}
svg{display:block;width:500px;height:900px}
@media print { svg{width:50mm;height:90mm} }
</style></head><body>
<svg viewBox="0 0 500 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9c9bf"/>
      <stop offset=".3" stop-color="#c98f86"/>
      <stop offset=".55" stop-color="#f0d5cc"/>
      <stop offset=".8" stop-color="#b8766f"/>
      <stop offset="1" stop-color="#8e5754"/>
    </linearGradient>
    <linearGradient id="rgText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c98f86"/>
      <stop offset=".35" stop-color="#e6bdb2"/>
      <stop offset=".6" stop-color="#c2847c"/>
      <stop offset="1" stop-color="#a86a64"/>
    </linearGradient>
  </defs>
  <rect width="500" height="900" fill="#ffffff"/>

  <!-- frame following the tag shape (chamfered top corners) -->
  <path d="M150 28 H350 L472 150 V872 H28 V150 Z" fill="none" stroke="url(#rg)" stroke-width="3.5" stroke-linejoin="miter"/>
  <path d="M157 44 H343 L456 157 V856 H44 V157 Z" fill="none" stroke="url(#rg)" stroke-width="1.4" stroke-linejoin="miter"/>

  <!-- logo -->
  <g transform="translate(0,157.5) scale(0.5)">
    <text x="506.5" y="535" text-anchor="middle" fill="url(#rgText)"
      font-family="Montserrat" font-weight="500" font-size="92" letter-spacing="22">BRUNCH<tspan dx="34">IT</tspan></text>
    <text x="500" y="615" text-anchor="middle" direction="rtl" fill="#b37b74"
      font-family="Heebo" font-weight="500" font-size="42" letter-spacing="1">מגשי אירוח ופינגר פוד חלבי</text>
  </g>

  <!-- divider with small heart -->
  <line x1="150" y1="550" x2="225" y2="550" stroke="#c98f86" stroke-width="1.4"/>
  <line x1="275" y1="550" x2="350" y2="550" stroke="#c98f86" stroke-width="1.4"/>
  <path transform="translate(250 550) scale(1.15)" fill="url(#rg)"
    d="M0 9 C-3 6 -14 -1 -14 -7 C-14 -12 -10 -15 -6.5 -15 C-3.5 -15 -1.2 -13 0 -10.5 C1.2 -13 3.5 -15 6.5 -15 C10 -15 14 -12 14 -7 C14 -1 3 6 0 9 Z"/>

  <!-- phone -->
  <text x="252" y="620" text-anchor="middle" direction="ltr" fill="url(#rgText)"
    font-family="Montserrat" font-weight="500" font-size="36" letter-spacing="4">055-6769466</text>
</svg>
</body></html>
